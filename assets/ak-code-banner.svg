<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="codeglow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="12"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <!-- Code lines decoration -->
  <text x="60" y="370" font-family="'Courier New', monospace" font-size="12" fill="#2d4a5a" opacity="0.6">&gt; _</text>
  <text x="120" y="350" font-family="'Courier New', monospace" font-size="11" fill="#2d4a5a" opacity="0.4">let greeting = "Hello from AK CODE"</text>
  <text x="120" y="335" font-family="'Courier New', monospace" font-size="11" fill="#2d4a5a" opacity="0.3">show greeting</text>
  <!-- Main title -->
  <text x="80" y="140" font-family="'Segoe UI', -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff">AK CODE</text>
  <text x="80" y="185" font-family="'Segoe UI', -apple-system, sans-serif" font-size="22" fill="#7a9bb5" font-weight="400">A programming language that reads like a conversation</text>
  <!-- Tagline -->
  <rect x="80" y="210" width="340" height="36" rx="6" fill="url(#codeglow)" stroke="#00b894" stroke-width="1" stroke-opacity="0.3"/>
  <text x="95" y="234" font-family="'Courier New', monospace" font-size="15" fill="#00b894">show "Hello from AK CODE"</text>
  <!-- Feature pills -->
  <rect x="80" y="270" width="130" height="28" rx="14" fill="#1a2a3a" stroke="#2d4a5a" stroke-width="1"/>
  <text x="111" y="289" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7a9bb5" text-anchor="middle">x86-64 Assembly</text>
  <rect x="220" y="270" width="100" height="28" rx="14" fill="#1a2a3a" stroke="#2d4a5a" stroke-width="1"/>
  <text x="270" y="289" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7a9bb5" text-anchor="middle">ELF + PE</text>
  <rect x="330" y="270" width="120" height="28" rx="14" fill="#1a2a3a" stroke="#2d4a5a" stroke-width="1"/>
  <text x="390" y="289" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7a9bb5" text-anchor="middle">Native Binary</text>
  <rect x="460" y="270" width="130" height="28" rx="14" fill="#1a2a3a" stroke="#2d4a5a" stroke-width="1"/>
  <text x="525" y="289" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7a9bb5" text-anchor="middle">English Syntax</text>
  <!-- Stats -->
  <rect x="750" y="100" width="370" height="180" rx="12" fill="#0d1520" stroke="#1a2a3a" stroke-width="1"/>
  <text x="790" y="140" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#00b894">900+</text>
  <text x="790" y="160" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5a7a8a">Spec Lines</text>
  <line x1="790" y1="175" x2="1080" y2="175" stroke="#1a2a3a" stroke-width="1"/>
  <text x="790" y="205" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#00b894">100+</text>
  <text x="790" y="225" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5a7a8a">Language Features</text>
  <line x1="790" y1="240" x2="1080" y2="240" stroke="#1a2a3a" stroke-width="1"/>
  <text x="790" y="268" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5a7a8a">Bootstrap: </text>
  <text x="870" y="268" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00b894">x86-64 NASM</text>
</svg>
